# /etc/mosquitto/conf.d/ecosort.conf
# Escuchar en el puerto 1883 en todas las interfaces (sin esto, Mosquitto 2.x solo acepta localhost).
listener 1883
# Sin usuario/contraseña: aceptado en ADR 0003 (el tráfico no sale de la red de la Pi).
allow_anonymous true

# Cola por cliente persistente (adapter, dashboard) mientras está caído. Default 1000:
# pasado el tope, los eventos nuevos se descartan sin aviso (la Pi igual recibe el PUBACK).
max_queued_messages 5000
