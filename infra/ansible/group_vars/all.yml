---
# Variables del despliegue en la Pi. Se pueden pisar por host en inventory/hosts.yml
# (ansible_user ya lo hace) o con -e en la línea de comandos.
ecosort_user: "{{ ansible_user | default(ansible_user_id) }}"
ecosort_home: "/home/{{ ecosort_user }}"
ecosort_dir: "{{ ecosort_home }}/ecosort"          # docs/guia-instalacion-raspberry.md, paso 7
ecosort_venv: "{{ ecosort_home }}/ecosort-venv"    # paso 5

ecosort_modelo: "ecosort_int8.tflite"    # en raspberry/modelo/ (paso 6/8: int8 es el que se usa)
ecosort_video: true                       # --video: sirve el video en :8000 (paso 9/10)
ecosort_broker: "localhost"               # Mosquitto corre en la propia Pi
